<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cdeskspace — Workspace Operations</title>
<style>
:root{--blue:#1479cc;--ink:#172033;--muted:#68758a;--line:#e3e8ef;--bg:#f4f7fb;--green:#16834a;--red:#c43b43;--amber:#a96809}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--blue);color:white}button.secondary{background:#edf3f9;color:#24354c;border:1px solid var(--line)}button:hover{filter:brightness(.96)}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top{max-width:1400px;margin:auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:18px;display:flex;align-items:center;gap:10px}.logo{background:var(--blue);color:white;border-radius:12px;width:38px;height:38px;display:grid;place-items:center}.layout{max-width:1400px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:220px 1fr;gap:22px}.sidebar,.panel,.card,.formbox,.tablebox{background:#fff;border:1px solid var(--line);border-radius:16px}.sidebar{padding:12px;height:max-content;position:sticky;top:82px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#46546a;text-align:left}.nav button.active{background:#eaf4ff;color:#075da7}.nav button:hover{background:#f2f6fa}.sidehint{border-top:1px solid var(--line);margin-top:15px;padding:12px 6px;color:var(--muted);font-size:12px}.pagehead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin:3px 0 20px}.eyebrow{color:var(--blue);font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}h1{font-size:29px;letter-spacing:-.04em;margin:4px 0}h2{font-size:18px;margin:0 0 5px}h3{margin:0 0 8px}.muted,.sub,.hint{color:var(--muted)}.sub{margin:0}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:18px}.card,.panel,.formbox{padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;letter-spacing:-.04em;margin:5px 0}.stat em{font-size:12px;color:var(--muted);font-style:normal}.two{grid-template-columns:1fr 1fr}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:750;color:#526076}input,select,textarea{width:100%;border:1px solid #dce3ec;border-radius:10px;padding:11px 12px;background:white;color:var(--ink)}textarea{min-height:82px}input:focus,select:focus,textarea:focus{outline:2px solid #1479cc30;border-color:var(--blue)}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;gap:10px}.tablebox{overflow:auto}.tablehead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid #edf0f4;font-size:13px;white-space:nowrap}th{font-size:11px;color:#7c8798;text-transform:uppercase;letter-spacing:.07em;background:#fbfcfe}.pill{display:inline-block;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:800}.paid{background:#e6f6ed;color:var(--green)}.partial{background:#fff3dc;color:var(--amber)}.unpaid,.expired{background:#ffebec;color:var(--red)}.activepill{background:#e8f3ff;color:#075da7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.hint{font-size:12px}.suggestions{background:#f3f9ff;border:1px solid #cfe3f7;border-radius:10px;padding:9px;margin-top:5px}.suggestion{display:flex;align-items:center;justify-content:space-between;padding:5px 0;gap:8px}.summary{background:#f1f7fd;border:1px solid #d6e8f8;border-radius:12px;padding:16px;margin-top:15px}.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #dce9f5;gap:10px}.line:last-child{border:0}.privacy{display:flex;justify-content:space-between;align-items:center;background:#fff8e9;border:1px solid #f1dfb9;border-radius:12px;padding:12px;margin-bottom:16px}.blurred .sensitive,.blurred td:nth-child(-n+3),.blurred input,.blurred select,.blurred textarea{filter:blur(7px);user-select:none;pointer-events:none}.toast{position:fixed;bottom:18px;right:18px;background:#172033;color:white;padding:12px 16px;border-radius:10px;z-index:9}.hidden{display:none!important}.empty{text-align:center;padding:25px;color:var(--muted)}footer{text-align:center;color:#8993a3;font-size:12px;padding:24px}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static}.nav{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.layout{padding:0 12px;margin:14px auto}.top{padding:12px}.pagehead{display:block}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.nav{grid-template-columns:repeat(2,1fr)}.stats{gap:8px}.stat strong{font-size:21px}}
</style></head><body>
<header><div class="top"><div class="brand"><div class="logo">CD</div><div>Cdeskspace<div class="hint" style="font-weight:500">Coworking space operations</div></div></div><div class="actions" style="margin:0"><button class="secondary" id="export">Export JSON</button><button class="secondary" id="import">Import JSON</button><button class="secondary hidden" id="unlock">Unlock view</button><input id="file" type="file" accept=".json,application/json" hidden></div></div></header>
<div class="layout"><aside class="sidebar"><div class="eyebrow" style="padding:8px">Workspace</div><nav class="nav"><button data-page="overview" class="active">▦ &nbsp; Overview</button><button data-page="new">＋ &nbsp; New subscription</button><button data-page="customers">♙ &nbsp; Customers</button><button data-page="subscriptions">▤ &nbsp; Subscriptions</button><button data-page="payments">₣ &nbsp; Payments</button><button data-page="reports">▥ &nbsp; Reports</button><button data-page="settings">⚙ &nbsp; Settings & data</button></nav><div class="sidehint">Prototype · Data is saved only in this browser until cloud sync is added.</div></aside><main id="main"></main></div><footer>Cdeskspace · Prototype · Local browser data only</footer><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';const KEY='cdeskspace_workspace_v1',today=()=>new Date().toISOString().slice(0,10),id=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),money=n=>new Intl.NumberFormat('en-US').format(Number(n)||0)+' FCFA',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({meta:{app:'Cdeskspace Workspace Operations',schemaVersion:1,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),currency:'XAF',privacy:{enabled:true,timeoutSeconds:60}},settings:{plans:[{id:'hot-desk',name:'Hot Desk',unit:'space',prices:{'1 Hour':1000,'1 Day':2500,'1 Week':10000,'1 Month':20000,'3 Months':50000}},{id:'private-office',name:'Shared Private Office',unit:'seat',prices:{'1 Month':40000,'3 Months':110000,'6 Months':230000}},{id:'meetings',name:'Meetings & Events',unit:'booking',prices:{'1 Hour':10000,'1 Day':25000}},{id:'tests',name:'Tests & Interviews',unit:'booking',prices:{'1 Hour':4000,'2 Hours':6000,'3 Hours':8000,'4 Hours':10000}}],paymentMethods:['MTN MoMo','Orange Money','Cash','Bank transfer','Other']},customers:[{id:'cus_awaw',name:'Maya Nfor',email:'',phone:'+237 600 000 101',createdAt:'2026-11-04',notes:''},{id:'cus_enoma',name:'Nora Bekondo',email:'nora@example.com',phone:'+237 600 000 102',createdAt:'2026-11-04',notes:''},{id:'cus_finley',name:'Sam Elad',email:'',phone:'',createdAt:'2026-10-20',notes:''},{id:'cus_godlove',name:'Ari Tamba',email:'',phone:'',createdAt:'2026-10-07',notes:''},{id:'cus_sopseh',name:'Lina Fomukong',email:'',phone:'',createdAt:'2026-10-20',notes:''}],subscriptions:[{id:'sub_a',customerId:'cus_awaw',planId:'hot-desk',planName:'Hot Desk',duration:'1 Day',startDate:'2026-11-04',endDate:'2026-11-05',expectedAmount:2500,status:'active',createdAt:'2026-11-04',notes:'Returning client'},{id:'sub_e',customerId:'cus_enoma',planId:'hot-desk',planName:'Hot Desk',duration:'2 Hours',startDate:'2026-11-05',endDate:'2026-11-05',expectedAmount:2000,status:'active',createdAt:'2026-11-05',notes:'New client'},{id:'sub_g',customerId:'cus_godlove',planId:'private-office',planName:'Shared Private Office',duration:'1 Month',startDate:'2026-10-07',endDate:'2026-11-07',expectedAmount:20000,status:'active',createdAt:'2026-10-07',notes:'Pending'}],payments:[{id:'pay_a',subscriptionId:'sub_a',customerId:'cus_awaw',amount:2500,method:'MTN MoMo',date:'2026-11-04',reference:'',notes:''},{id:'pay_e',subscriptionId:'sub_e',customerId:'cus_enoma',amount:2000,method:'MTN MoMo',date:'2026-11-05',reference:'',notes:''}],cashEntries:[],dailyNotes:[],reportSnapshots:[]});
function validate(s){if(!s||!s.meta||!s.settings||!Array.isArray(s.customers)||!Array.isArray(s.subscriptions)||!Array.isArray(s.payments))throw Error('JSON does not match the expected notebook structure.');if(s.meta.schemaVersion!==1)throw Error('Unsupported schemaVersion. This prototype accepts version 1.');return s}let db;try{db=validate(JSON.parse(localStorage.getItem(KEY)))}catch{db=seed()}let page='overview',blurred=false,timer;function save(){db.meta.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db))}function customer(cid){return db.customers.find(c=>c.id===cid)||{name:'Unknown customer'}}function plan(pid){return db.settings.plans.find(p=>p.id===pid)}function paid(sid){return db.payments.filter(p=>p.subscriptionId===sid).reduce((a,p)=>a+Number(p.amount||0),0)}function balance(s){return Math.max(0,Number(s.expectedAmount)-paid(s.id))}function status(s){let n=paid(s.id);return n<=0?'Unpaid':n>=Number(s.expectedAmount)?'Paid':'Partially paid'}function badge(s){return `<span class="pill ${s==='Paid'?'paid':s==='Partially paid'?'partial':'unpaid'}">${s}</span>`}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function head(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">Cdeskspace · Workspace</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}function table(rows,heads){return `<div class="tablebox"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${heads.length}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`}
function overview(){let d=today(),income=db.payments.filter(p=>p.date===d).reduce((a,p)=>a+p.amount,0),active=db.subscriptions.filter(s=>s.status==='active'&&s.endDate>=d).length,out=db.subscriptions.reduce((a,s)=>a+balance(s),0),newc=db.customers.filter(c=>c.createdAt===d).length;let recent=[...db.subscriptions].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,8);return head('Your workspace at a glance','A quick view of membership and payment activity.',`<button data-go="new">＋ New subscription</button>`)+`<div class="grid stats"><div class="card stat"><small>Money received today</small><strong>${money(income)}</strong><em>Recorded payments only</em></div><div class="card stat"><small>Active subscriptions</small><strong>${active}</strong><em>Not yet expired</em></div><div class="card stat"><small>Outstanding balance</small><strong>${money(out)}</strong><em>Across all subscriptions</em></div><div class="card stat"><small>New customers today</small><strong>${newc}</strong><em>Profiles created today</em></div></div><div class="section"><div><h2>Recent subscription activity</h2><span class="hint">Latest records</span></div><button class="secondary" data-go="subscriptions">View all</button></div>${table(recent.map(s=>`<tr><td><b>${esc(customer(s.customerId).name)}</b></td><td>${esc(s.planName)}</td><td>${esc(s.startDate)} → ${esc(s.endDate)}</td><td>${money(s.expectedAmount)}</td><td>${money(paid(s.id))}</td><td>${badge(status(s))}</td></tr>`).join(''),['Customer','Plan','Period','Expected','Received','Payment'])}<div class="section"><h2>Quick actions</h2></div><div class="grid two"><div class="panel"><h3>Record money received</h3><p class="muted">Add a full or partial payment.</p><button data-go="payments">Open payments</button></div><div class="panel"><h3>Write a daily summary</h3><p class="muted">Generate figures and add operational context.</p><button data-go="reports">Open reports</button></div></div>`}
function newSub(){return head('New subscription','Register a customer and record the plan they are purchasing.')+`<div class="formbox"><form id="newForm"><div class="section"><div><h2>1. Customer information</h2><span class="hint">Search existing records first.</span></div></div><div class="fields"><div class="field full"><label>Customer name *</label><input name="name" id="cname" required autocomplete="off" placeholder="Start typing a customer name"><div id="matches"></div></div><div class="field"><label>Email</label><input name="email" type="email" placeholder="customer@email.com"></div><div class="field"><label>Phone number</label><input name="phone" placeholder="6XX XXX XXX"></div></div><input type="hidden" name="customerId" id="customerId"><div class="section"><div><h2>2. Subscription details</h2><span class="hint">Renewals create a new period; old records stay intact.</span></div></div><div class="fields"><div class="field"><label>Plan *</label><select name="planId" id="planSelect">${db.settings.plans.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Duration *</label><select name="duration" id="duration"></select></div><div class="field"><label>Start date</label><input name="startDate" type="date" value="${today()}" required></div><div class="field"><label>End date</label><input name="endDate" type="date" value="${today()}" required></div><div class="field"><label>Expected amount (FCFA)</label><input name="expectedAmount" id="expected" type="number" min="0" required></div><div class="field"><label>Amount received now (FCFA)</label><input name="amountPaid" type="number" min="0" value="0"></div><div class="field"><label>Payment method</label><select name="method">${db.settings.paymentMethods.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div><div class="field full"><label>Notes</label><textarea name="notes" placeholder="Payment arrangement, special requests, client context..."></textarea></div></div><div class="actions"><button>Save subscription record</button><button type="reset" class="secondary">Clear form</button></div></form></div>`}
function customers(){let rows=db.customers.map(c=>{let ss=db.subscriptions.filter(s=>s.customerId===c.id),total=ss.reduce((a,s)=>a+paid(s.id),0);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.email||'—')}<br>${esc(c.phone||'')}</td><td>${ss.length}</td><td>${money(total)}</td><td>${esc(ss.map(s=>s.createdAt).sort().pop()||'—')}</td></tr>`}).join('');return head('Customer notebook','One profile per customer, with their complete subscription history.')+`<div class="tablebox"><div class="tablehead"><h2>Customers (${db.customers.length})</h2><input id="searchCustomers" placeholder="Search name, email or phone" style="max-width:280px"></div><div id="customerTable">${table(rows,['Customer','Contact','Subscriptions','Total paid','Last activity'])}</div></div>`}
function subscriptions(){let rows=db.subscriptions.map(s=>`<tr><td><b>${esc(customer(s.customerId).name)}</b></td><td>${esc(s.planName)}</td><td>${esc(s.duration)}</td><td>${esc(s.startDate)}</td><td>${esc(s.endDate)}</td><td>${money(s.expectedAmount)}</td><td>${money(paid(s.id))}</td><td>${money(balance(s))}</td><td>${badge(status(s))}</td></tr>`).join('');return head('Subscriptions','All subscription periods, including renewals and expired records.',`<button data-go="new">＋ New subscription</button>`)+`<div class="tablebox"><div class="tablehead"><h2>Subscription register (${db.subscriptions.length})</h2><input id="searchSubs" placeholder="Search customer or plan" style="max-width:280px"></div><div id="subscriptionTable">${table(rows,['Customer','Plan','Duration','Start','End','Expected','Received','Balance','Payment'])}</div></div>`}
function payments(){let rows=[...db.payments].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{let s=db.subscriptions.find(x=>x.id===p.subscriptionId);return `<tr><td>${esc(p.date)}</td><td>${esc(customer(p.customerId).name)}</td><td>${esc(s?.planName||'—')}</td><td>${esc(p.method)}</td><td>${esc(p.reference||'—')}</td><td><b>${money(p.amount)}</b></td></tr>`}).join('');return head('Payment register','Record actual money received against an existing subscription.')+`<div class="grid two"><div class="formbox"><h2>Add a payment</h2><form id="paymentForm"><div class="field"><label>Subscription *</label><select name="subscriptionId" required>${db.subscriptions.map(s=>`<option value="${s.id}">${esc(customer(s.customerId).name)} · ${esc(s.planName)} · Balance ${money(balance(s))}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Amount received (FCFA)</label><input name="amount" type="number" min="1" required></div><div class="field" style="margin-top:12px"><label>Payment method</label><select name="method">${db.settings.paymentMethods.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Payment date</label><input name="date" type="date" value="${today()}" required></div><div class="field" style="margin-top:12px"><label>Reference / note</label><input name="reference"></div><div class="actions"><button>Save payment</button></div></form></div><div class="panel"><h2>Payment rules</h2><ul class="muted"><li>Only record money actually received.</li><li>Partial payments are separate transactions.</li><li>Balance = expected amount − payments received.</li><li>Do not erase financial history to correct mistakes; add adjustment records in a future version.</li></ul></div></div><div class="section"><h2>Payment history</h2></div>${table(rows,['Date','Customer','Subscription','Method','Reference','Amount'])}`}
function range(period,end){let e=new Date(end+'T12:00:00'),s=new Date(e);if(period==='Weekly')s.setDate(s.getDate()-6);if(period==='Monthly')s.setMonth(s.getMonth()-1);if(period==='6 months')s.setMonth(s.getMonth()-6);if(period==='Yearly')s.setFullYear(s.getFullYear()-1);return [s.toISOString().slice(0,10),end]}
function reportData(period,end){let [start,finish]=range(period,end),ss=db.subscriptions.filter(s=>s.createdAt>=start&&s.createdAt<=finish),ps=db.payments.filter(p=>p.date>=start&&p.date<=finish),methods={};ps.forEach(p=>methods[p.method]=(methods[p.method]||0)+p.amount);return {id:id('report'),period,startDate:start,endDate:finish,generatedAt:new Date().toISOString(),received:ps.reduce((a,p)=>a+p.amount,0),subscriptionCount:ss.length,newCustomers:db.customers.filter(c=>c.createdAt>=start&&c.createdAt<=finish).length,renewals:ss.filter(s=>db.subscriptions.some(o=>o.customerId===s.customerId&&o.id!==s.id&&o.createdAt<s.createdAt)).length,unpaidSubscriptions:ss.filter(s=>status(s)!=='Paid').length,paymentMethods:methods,notes:'',subscriptionIds:ss.map(s=>s.id),paymentIds:ps.map(p=>p.id)}}
function reports(){let saved=[...db.reportSnapshots].reverse().map(r=>`<tr><td>${esc(r.period)}</td><td>${esc(r.startDate)} → ${esc(r.endDate)}</td><td>${money(r.received)}</td><td>${r.subscriptionCount}</td><td>${new Date(r.generatedAt).toLocaleString()}</td></tr>`).join('');return head('Reports','Generate summaries from saved records, then add human context.')+`<div class="grid two"><div class="formbox"><form id="reportForm"><div class="field"><label>Report period</label><select name="period"><option>Daily</option><option>Weekly</option><option>Monthly</option><option>6 months</option><option>Yearly</option></select></div><div class="field" style="margin-top:12px"><label>Ending date</label><input type="date" name="endDate" value="${today()}"></div><div class="actions"><button>Generate summary</button></div></form><p class="hint">Weekly is seven days ending on the selected date. Monthly, six-month and yearly are rolling periods in this prototype.</p></div><div class="panel"><h2>Included in the report</h2><ul class="muted"><li>Actual payments received by payment date.</li><li>Subscriptions created during the selected range.</li><li>New customer profiles and identified renewals.</li><li>Payment method breakdown and manager notes.</li></ul></div></div><div id="reportOutput"></div><div class="section"><div><h2>Saved report history</h2><span class="hint">Saved snapshots</span></div></div>${table(saved,['Period','Dates','Income received','Subscriptions','Generated'])}`}
function settings(){return head('Settings & data','Configure privacy and manage the portable JSON notebook.')+`<div class="grid two"><div class="formbox"><h2>Privacy blur</h2><p class="muted">Blur customer and subscription details after inactivity. This is a visual privacy feature, not a security boundary.</p><label><input id="privacyEnabled" type="checkbox" style="width:auto" ${db.meta.privacy.enabled?'checked':''}> Enable automatic blur</label><div class="field" style="margin-top:12px"><label>Timeout in seconds</label><input id="timeout" type="number" min="10" max="3600" value="${db.meta.privacy.timeoutSeconds}"></div><div class="actions"><button id="savePrivacy">Save settings</button><button class="secondary" id="blurNow">Blur now</button></div></div><div class="formbox"><h2>Portable data</h2><p class="muted">The complete dataset is one JSON object. Export before importing another version.</p><div class="actions"><button id="export2">Export full JSON</button><button class="secondary" id="import2">Import JSON</button><button class="secondary" id="reset">Reset sample data</button></div><p class="hint">Import replaces current browser data. Keep JSON exports private; they contain customer and payment information.</p></div></div><div class="section"><div><h2>Configured plans</h2><span class="hint">Existing subscriptions retain their original saved prices.</span></div></div><div class="grid two">${db.settings.plans.map(p=>`<div class="panel"><h3>${esc(p.name)}</h3>${Object.entries(p.prices).map(([d,v])=>`<div class="line"><span>${esc(d)}</span><b>${money(v)}</b></div>`).join('')}</div>`).join('')}</div>`}
function render(){let views={overview,new:newSub,customers,subscriptions,payments,reports,settings};document.querySelector('#main').innerHTML=views[page]();document.querySelector('#main').classList.toggle('blurred',blurred);bind();}
function exportJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`cdeskspace-backup-${today()}.json`;a.click();URL.revokeObjectURL(url);toast('JSON backup exported.')}function importJSON(){document.querySelector('#file').click()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));let f=document.querySelector('#newForm');if(f){let nm=f.elements.name,box=document.querySelector('#matches'),cid=document.querySelector('#customerId');nm.oninput=()=>{cid.value='';let q=nm.value.toLowerCase().trim(),found=q.length>1?db.customers.filter(c=>[c.name,c.email,c.phone].join(' ').toLowerCase().includes(q)).slice(0,6):[];box.innerHTML=found.length?`<div class="suggestions"><b class="hint">Possible returning customers</b>${found.map(c=>`<div class="suggestion"><span><b>${esc(c.name)}</b><br><small>${esc(c.email||'')} ${esc(c.phone||'')}</small></span><button type="button" class="secondary" data-pick="${c.id}">Use profile</button></div>`).join('')}</div>`:''};box.onclick=e=>{let b=e.target.closest('[data-pick]');if(!b)return;let c=customer(b.dataset.pick);cid.value=c.id;nm.value=c.name;f.elements.email.value=c.email||'';f.elements.phone.value=c.phone||'';box.textContent='✓ Existing customer selected.'};let ps=document.querySelector('#planSelect'),ds=document.querySelector('#duration'),am=document.querySelector('#expected');function opts(){let p=plan(ps.value);ds.innerHTML=Object.keys(p.prices).map(k=>`<option>${esc(k)}</option>`).join('');am.value=Object.values(p.prices)[0]}ps.onchange=opts;ds.onchange=()=>am.value=plan(ps.value).prices[ds.value];opts();f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),c=d.get('customerId')?customer(d.get('customerId')):null;if(!c){c={id:id('cus'),name:d.get('name').trim(),email:d.get('email').trim(),phone:d.get('phone').trim(),createdAt:today(),notes:''};db.customers.push(c)}else{c.email=d.get('email').trim()||c.email;c.phone=d.get('phone').trim()||c.phone}let p=plan(d.get('planId')),s={id:id('sub'),customerId:c.id,planId:p.id,planName:p.name,duration:d.get('duration'),startDate:d.get('startDate'),endDate:d.get('endDate'),expectedAmount:Number(d.get('expectedAmount')),status:'active',createdAt:today(),notes:d.get('notes')};db.subscriptions.push(s);let n=Number(d.get('amountPaid')||0);if(n>0)db.payments.push({id:id('pay'),subscriptionId:s.id,customerId:c.id,amount:n,method:d.get('method'),date:today(),reference:'',notes:'Initial payment'});save();toast('Subscription saved.');go('subscriptions')}}
let pf=document.querySelector('#paymentForm');if(pf)pf.onsubmit=e=>{e.preventDefault();let d=new FormData(pf),s=db.subscriptions.find(x=>x.id===d.get('subscriptionId')),n=Number(d.get('amount'));if(n>balance(s)&&!confirm('This payment exceeds the current balance. Record it anyway?'))return;db.payments.push({id:id('pay'),subscriptionId:s.id,customerId:s.customerId,amount:n,method:d.get('method'),date:d.get('date'),reference:d.get('reference'),notes:''});save();toast('Payment recorded.');go('payments')};let cf=document.querySelector('#searchCustomers');if(cf)cf.oninput=()=>{let q=cf.value.toLowerCase(),list=db.customers.filter(c=>[c.name,c.email,c.phone].join(' ').toLowerCase().includes(q));document.querySelector('#customerTable').innerHTML=table(list.map(c=>{let ss=db.subscriptions.filter(s=>s.customerId===c.id);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.email||'—')}<br>${esc(c.phone||'')}</td><td>${ss.length}</td><td>${money(ss.reduce((a,s)=>a+paid(s.id),0))}</td><td>${esc(ss.map(s=>s.createdAt).sort().pop()||'—')}</td></tr>`}).join(''),['Customer','Contact','Subscriptions','Total paid','Last activity'])};let sf=document.querySelector('#searchSubs');if(sf)sf.oninput=()=>{let q=sf.value.toLowerCase(),ss=db.subscriptions.filter(s=>(customer(s.customerId).name+' '+s.planName).toLowerCase().includes(q));document.querySelector('#subscriptionTable').innerHTML=table(ss.map(s=>`<tr><td>${esc(customer(s.customerId).name)}</td><td>${esc(s.planName)}</td><td>${esc(s.duration)}</td><td>${esc(s.startDate)}</td><td>${esc(s.endDate)}</td><td>${money(s.expectedAmount)}</td><td>${money(paid(s.id))}</td><td>${money(balance(s))}</td><td>${badge(status(s))}</td></tr>`).join(''),['Customer','Plan','Duration','Start','End','Expected','Received','Balance','Payment'])};let rf=document.querySelector('#reportForm');if(rf)rf.onsubmit=e=>{e.preventDefault();let d=new FormData(rf),r=reportData(d.get('period'),d.get('endDate')),methods=Object.entries(r.paymentMethods).map(([k,v])=>`<div class="line"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')||'<p class="hint">No payments in this period.</p>';document.querySelector('#reportOutput').innerHTML=`<div class="summary"><div class="section" style="margin-top:0"><div><div class="eyebrow">Generated summary</div><h2>${esc(r.period)} · ${r.startDate} to ${r.endDate}</h2></div><button id="saveReport">Save snapshot</button></div><div class="grid stats"><div class="card stat"><small>Money received</small><strong>${money(r.received)}</strong></div><div class="card stat"><small>Subscriptions</small><strong>${r.subscriptionCount}</strong></div><div class="card stat"><small>New customers</small><strong>${r.newCustomers}</strong></div><div class="card stat"><small>Renewals identified</small><strong>${r.renewals}</strong></div></div><h3>Payment methods</h3>${methods}<h3 style="margin-top:18px">Manager's notes</h3><textarea id="reportNotes" placeholder="Explain unusual collections, handovers, corrections or operational context..."></textarea><div class="actions"><button class="secondary" id="copyReport">Copy report text</button></div></div>`;document.querySelector('#saveReport').onclick=()=>{r.notes=document.querySelector('#reportNotes').value;db.reportSnapshots.push(r);save();toast('Report snapshot saved.');go('reports')};document.querySelector('#copyReport').onclick=()=>{let t=`${r.period} report ${r.startDate} to ${r.endDate}\nIncome received: ${money(r.received)}\nSubscriptions: ${r.subscriptionCount}\nNew customers: ${r.newCustomers}\nRenewals: ${r.renewals}\nNotes: ${document.querySelector('#reportNotes').value}`;navigator.clipboard?.writeText(t).then(()=>toast('Report copied.'))}};
let sp=document.querySelector('#savePrivacy');if(sp)sp.onclick=()=>{db.meta.privacy.enabled=document.querySelector('#privacyEnabled').checked;db.meta.privacy.timeoutSeconds=Math.max(10,Math.min(3600,Number(document.querySelector('#timeout').value)||60));save();setupPrivacy();toast('Privacy settings saved.')};let bn=document.querySelector('#blurNow');if(bn)bn.onclick=()=>{blurred=true;render();toast('Sensitive details blurred.')};let ex=document.querySelector('#export2');if(ex)ex.onclick=exportJSON;let im=document.querySelector('#import2');if(im)im.onclick=importJSON;let reset=document.querySelector('#reset');if(reset)reset.onclick=()=>{if(confirm('Replace current data with the original sample data? Export a backup first.')){db=seed();save();blurred=false;go('overview')}}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelector('#export').onclick=exportJSON;document.querySelector('#import').onclick=importJSON;document.querySelector('#unlock').onclick=()=>{blurred=false;render();toast('Notebook view unlocked.')};document.querySelector('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let next=validate(JSON.parse(await f.text()));if(confirm('Importing replaces all current data in this browser. Export a backup first. Continue?')){db=next;save();blurred=false;setupPrivacy();go('overview');toast('JSON imported.')}}catch(err){alert('Import failed: '+err.message)}e.target.value=''};
function setupPrivacy(){clearTimeout(timer);if(!db.meta.privacy.enabled)return;const reset=()=>{clearTimeout(timer);timer=setTimeout(()=>{blurred=true;document.querySelector('#main').classList.add('blurred');document.querySelector('#unlock').classList.remove('hidden')},db.meta.privacy.timeoutSeconds*1000)};['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,reset,{passive:true}));reset()}setupPrivacy();render();})();
</script></body></html>
